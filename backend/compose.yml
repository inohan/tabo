services:
  postgres-test:
    image: postgres:18
    profiles: [test]
    tmpfs:
      - /var/lib/postgresql/18/docker
    environment:
      POSTGRES_PASSWORD: tabo
      POSTGRES_USER: tabo
      POSTGRES_DB: tabo_test
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    ports:
      - '6601:5432'
    healthcheck:
      # -h 127.0.0.1 forces TCP so the socket-only server used during
      # first-time init is not mistaken for a ready database.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U tabo -d tabo_test']
      interval: 1s
      timeout: 3s
      retries: 30

  rustfs-test:
    image: rustfs/rustfs:latest
    profiles: [test]
    ports:
      - 6602:9000
      - 6603:9001
    environment:
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      - RUSTFS_CONSOLE_ENABLE=true
    command: ['--console-enable', '/data']

  postgres:
    image: postgres:18
    volumes:
      - pgdata:/var/lib/postgresql/18/docker
    environment:
      POSTGRES_PASSWORD: tabo123456
      POSTGRES_USER: tabo
      POSTGRES_DB: tabo
    ports:
      - '6501:5432'

  rustfs:
    image: rustfs/rustfs:latest
    volumes:
      - rustfs-data:/data
    ports:
      - 6502:9000
      - 6503:9001
    environment:
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      - RUSTFS_CONSOLE_ENABLE=true
    command: ['--console-enable', '/data']
volumes:
  pgdata:
  rustfs-data:
